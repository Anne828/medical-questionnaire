<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>電/化療程問卷與門診紀錄</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Noto Sans TC -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #FAF5EF; /* 溫馨柔暖米色背景 */
            color: #2D3748;
        }
        /* 針對50歲以上老花友好的字體與視覺設計 */
        .text-elderly-base { font-size: 1.25rem; line-height: 1.8; }  /* 20px */
        .text-elderly-lg { font-size: 1.5rem; line-height: 1.7; }     /* 24px */
        .text-elderly-xl { font-size: 1.875rem; line-height: 1.6; }   /* 30px */
        
        .custom-shadow {
            box-shadow: 0 4px 20px rgba(180, 100, 50, 0.08);
        }
    </style>
</head>
<body class="min-h-screen pb-16">

    <!-- 
    =============================================================================
    【Firebase 雲端設定區】
    =============================================================================
    -->
    <script>
        window.userCustomFirebaseConfig = {
            apiKey: "AIzaSyCduFQFxhBG-uwppCv5RcEsPTIiz4aZNuE",
            authDomain: "medical-q-af991.firebaseapp.com",
            projectId: "medical-q-af991",
            storageBucket: "medical-q-af991.firebasestorage.app",
            messagingSenderId: "115087176485",
            appId: "1:115087176485:web:619a9b8dbee0d0cac420cc",
            measurementId: "G-L7687LJQ1B"
        };
    </script>

    <!-- 頂部標題區 -->
    <header class="bg-amber-700 text-white py-6 px-4 shadow-md sticky top-0 z-10">
        <div class="max-w-4xl mx-auto flex flex-wrap justify-between items-center gap-4">
            <div>
                <h1 class="text-elderly-xl font-bold flex items-center gap-3">
                    <i class="fa-solid fa-heart-pulse text-amber-200"></i>
                    電/化療程問卷
                </h1>
                <p class="text-amber-100 text-lg mt-1">清晰大字版 ‧ 隨手記錄每一次的醫生叮嚀與家人備忘</p>
            </div>
            <!-- 模式切換鈕 -->
            <button id="toggleEditModeBtn" onclick="toggleEditMode()" 
                class="bg-amber-100 text-amber-900 font-bold px-5 py-3 rounded-xl hover:bg-white text-elderly-base transition-all flex items-center gap-2 border-2 border-amber-300 shadow">
                <i class="fa-solid fa-pen-to-square"></i>
                <span id="editModeBtnText">開啟「編輯/新增題目」模式</span>
            </button>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 mt-8">

        <!-- 同步狀態提示欄 -->
        <div id="syncStatus" class="mb-4 p-3 rounded-xl bg-amber-100 text-amber-900 text-elderly-base flex items-center justify-between border border-amber-300">
            <span class="flex items-center gap-2">
                <i id="syncIcon" class="fa-solid fa-cloud text-amber-600"></i>
                <span id="syncText">已啟用即時自動儲存 (離線/線上皆可運作)</span>
            </span>
            <span class="text-sm bg-amber-200 px-3 py-1 rounded-full text-amber-800 font-bold">家人連線同步中</span>
        </div>

        <!-- 編輯模式提醒 Banner -->
        <div id="editBanner" class="hidden mb-6 p-4 bg-amber-100 border-l-8 border-amber-600 rounded-r-xl text-amber-900 text-elderly-base flex justify-between items-center">
            <span><i class="fa-solid fa-circle-info mr-2"></i>目前為<strong>【題目編輯模式】</strong>，您可以修改問題名稱、刪除題目或新增自訂問題。</span>
            <button onclick="toggleEditMode()" class="underline font-bold hover:text-amber-700">完成編輯</button>
        </div>

        <!-- 問卷問題清單容器 -->
        <div id="questionnaireContainer" class="space-y-8">
            <!-- 題目卡片將由 JavaScript 動態渲染 -->
        </div>

        <!-- 新增題目按鈕 (編輯模式下顯示) -->
        <div id="addQuestionBox" class="hidden mt-8 text-center">
            <button onclick="addNewQuestionPrompt()" 
                class="bg-amber-600 hover:bg-amber-700 text-white font-bold py-4 px-8 rounded-2xl text-elderly-lg shadow-lg transition-all border-2 border-amber-400 flex items-center justify-center gap-3 mx-auto">
                <i class="fa-solid fa-circle-plus text-2xl"></i>
                點此新增自訂問題
            </button>
        </div>

        <!-- 底部分享與重置工具條 -->
        <div class="mt-12 pt-8 border-t-2 border-amber-200 flex flex-wrap justify-between items-center gap-4">
            <button onclick="window.print()" class="bg-emerald-700 hover:bg-emerald-800 text-white font-bold px-6 py-3 rounded-xl text-elderly-base flex items-center gap-2 shadow">
                <i class="fa-solid fa-print"></i> 列印 / 另存 PDF
            </button>
            <button onclick="resetToDefaultPrompt()" class="text-rose-700 hover:text-rose-900 font-bold text-elderly-base underline">
                恢復成初始預設問題
            </button>
        </div>

    </main>

    <!-- 訊息提示彈窗 (取代 alert) -->
    <div id="messageModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-3xl p-8 max-w-md w-full shadow-2xl border-4 border-amber-500 text-center">
            <div id="modalIcon" class="text-5xl text-amber-600 mb-4">
                <i class="fa-solid fa-circle-check"></i>
            </div>
            <h3 id="modalTitle" class="text-elderly-lg font-bold text-gray-800 mb-2">提示訊息</h3>
            <p id="modalMessage" class="text-elderly-base text-gray-600 mb-6">處置已成功完成。</p>
            <button onclick="closeModal()" class="w-full bg-amber-600 text-white font-bold py-3 rounded-xl text-elderly-base hover:bg-amber-700 transition">
                我知道了
            </button>
        </div>
    </div>

    <!-- 自訂輸入彈窗 (取代 prompt) -->
    <div id="promptModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-3xl p-8 max-w-lg w-full shadow-2xl border-4 border-amber-500">
            <h3 id="promptTitle" class="text-elderly-lg font-bold text-gray-800 mb-4">請輸入內容</h3>
            <input type="text" id="promptInput" class="w-full p-4 border-2 border-amber-300 rounded-xl text-elderly-base mb-6 focus:ring-4 focus:ring-amber-200 outline-none" placeholder="請在此輸入...">
            <div class="flex gap-4">
                <button onclick="closePromptModal()" class="flex-1 bg-gray-200 text-gray-800 font-bold py-3 rounded-xl text-elderly-base hover:bg-gray-300">取消</button>
                <button id="promptConfirmBtn" class="flex-1 bg-amber-600 text-white font-bold py-3 rounded-xl text-elderly-base hover:bg-amber-700">確定</button>
            </div>
        </div>
    </div>

    <!-- Firebase SDK 引入與邏輯處理 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // 讀取頂部設定的 Firebase Config
        const userCustomFirebaseConfig = window.userCustomFirebaseConfig || {};

        const firebaseConfig = (Object.keys(userCustomFirebaseConfig).length > 0) 
            ? userCustomFirebaseConfig 
            : (typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : null);

        let db = null;
        let auth = null;
        let docRef = null;

        // 預設完整的題目資料庫
        const defaultQuestions = [
            { id: 'q1', type: 'yes_no', title: '1. 禮拜五去做檢查，順便問禮拜一是否能看到報告？', answer: null, notes: [] },
            { id: 'q2_1', type: 'text', title: '2-1. 電療什麼時候開始做？', answer: '', notes: [] },
            { id: 'q2_2', type: 'text', title: '2-2. 電療幾天做一次？', answer: '', notes: [] },
            { id: 'q2_3', type: 'text', title: '2-3. 電療一次做多久？', answer: '', notes: [] },
            { id: 'q2_4', type: 'text', title: '2-4. 電療後有什麼副作用？', answer: '', notes: [] },
            { id: 'q2_5', type: 'text', title: '2-5. 回家要注意什麼？', answer: '', notes: [] },
            { id: 'q3_1', type: 'text', title: '3-1. 化療什麼時候開始做？', answer: '', notes: [] },
            { id: 'q3_2', type: 'text', title: '3-2. 化療多久做一次？', answer: '', notes: [] },
            { id: 'q3_3', type: 'text', title: '3-3. 化療一次做多久？', answer: '', notes: [] },
            { id: 'q3_4', type: 'text', title: '3-4. 化療後的副作用？', answer: '', notes: [] },
            { id: 'q3_5', type: 'text', title: '3-5. 回家要注意什麼？', answer: '', notes: [] }
        ];

        window.questions = [];
        window.isEditMode = false;

        async function initApp() {
            if (firebaseConfig && firebaseConfig.apiKey) {
                try {
                    const app = initializeApp(firebaseConfig);
                    auth = getAuth(app);
                    db = getFirestore(app);

                    await signInAnonymously(auth);

                    // 使用簡化且穩定的通用文件路徑：shared/medical_data
                    docRef = doc(db, 'shared', 'medical_data');
                    onSnapshot(docRef, (docSnap) => {
                        if (docSnap.exists()) {
                            const data = docSnap.data();
                            if (data && Array.isArray(data.questions)) {
                                window.questions = data.questions;
                                renderQuestionnaire();
                                updateSyncStatus(true, "雲端已實時連線同步");
                            }
                        } else {
                            saveData(defaultQuestions);
                        }
                    }, (error) => {
                        console.warn("Firebase Read Error:", error);
                        updateSyncStatus(false, "雲端讀取受阻 (請檢查 Firebase Rules 設定)");
                        loadFallbackData();
                    });
                } catch (e) {
                    console.error("Firebase Auth/Init Failed:", e);
                    loadFallbackData();
                }
            } else {
                updateSyncStatus(false, "尚未填寫 Firebase Config (目前為本機儲存模式)");
                loadFallbackData();
            }
        }

        function loadFallbackData() {
            const saved = localStorage.getItem('senior_treatment_questionnaire');
            if (saved) {
                try { window.questions = JSON.parse(saved); } 
                catch(e) { window.questions = JSON.parse(JSON.stringify(defaultQuestions)); }
            } else {
                window.questions = JSON.parse(JSON.stringify(defaultQuestions));
            }
            renderQuestionnaire();
        }

        function updateSyncStatus(isOnline, text) {
            const syncIcon = document.getElementById('syncIcon');
            const syncText = document.getElementById('syncText');
            if (syncText) syncText.innerText = text;
            if (syncIcon) {
                syncIcon.className = isOnline 
                    ? "fa-solid fa-cloud-arrow-up text-emerald-600 animate-pulse" 
                    : "fa-solid fa-hard-drive text-amber-600";
            }
        }

        window.saveData = async function(updatedQuestions) {
            if (updatedQuestions) window.questions = updatedQuestions;
            
            // 寫入本機備份
            localStorage.setItem('senior_treatment_questionnaire', JSON.stringify(window.questions));

            // 寫入雲端同步
            if (db && docRef) {
                try {
                    await setDoc(docRef, { questions: window.questions }, { merge: true });
                } catch (err) {
                    console.error("Firestore Save Error:", err);
                }
            }
            renderQuestionnaire();
        };

        window.renderQuestionnaire = function() {
            const container = document.getElementById('questionnaireContainer');
            if (!container) return;
            container.innerHTML = '';

            window.questions.forEach((q) => {
                const card = document.createElement('div');
                card.className = 'bg-white rounded-3xl p-6 sm:p-8 custom-shadow border-2 border-amber-200 transition-all';

                let headerHtml = `
                    <div class="flex items-start justify-between gap-4 mb-4">
                        <h2 class="text-elderly-lg font-bold text-amber-900 flex-1">${q.title}</h2>
                        ${window.isEditMode ? `
                            <div class="flex items-center gap-2 shrink-0">
                                <button onclick="editQuestionTitle('${q.id}')" class="text-amber-700 hover:text-amber-900 p-2 text-elderly-base"><i class="fa-solid fa-pen"></i></button>
                                <button onclick="deleteQuestion('${q.id}')" class="text-rose-600 hover:text-rose-800 p-2 text-elderly-base"><i class="fa-solid fa-trash"></i></button>
                            </div>
                        ` : ''}
                    </div>
                `;

                let answerHtml = '';
                if (q.type === 'yes_no') {
                    answerHtml = `
                        <div class="flex gap-4 my-4">
                            <button onclick="setYesNoAnswer('${q.id}', 'yes')" 
                                class="flex-1 py-4 rounded-2xl font-bold text-elderly-lg border-2 transition-all flex items-center justify-center gap-2 ${q.answer === 'yes' ? 'bg-amber-600 text-white border-amber-600 shadow-md' : 'bg-amber-50 text-amber-900 border-amber-200 hover:bg-amber-100'}">
                                <i class="fa-solid ${q.answer === 'yes' ? 'fa-circle-check' : 'fa-circle'}"></i> 是 (可以)
                            </button>
                            <button onclick="setYesNoAnswer('${q.id}', 'no')" 
                                class="flex-1 py-4 rounded-2xl font-bold text-elderly-lg border-2 transition-all flex items-center justify-center gap-2 ${q.answer === 'no' ? 'bg-rose-600 text-white border-rose-600 shadow-md' : 'bg-rose-50 text-rose-900 border-rose-200 hover:bg-rose-100'}">
                                <i class="fa-solid ${q.answer === 'no' ? 'fa-circle-xmark' : 'fa-circle'}"></i> 否 (不行/尚未)
                            </button>
                        </div>
                    `;
                } else {
                    answerHtml = `
                        <div class="my-4">
                            <label class="block text-elderly-base font-bold text-gray-700 mb-2">門診主要答覆 / 紀錄：</label>
                            <textarea onchange="updateTextAnswer('${q.id}', this.value)" 
                                class="w-full p-4 border-2 border-amber-300 rounded-2xl text-elderly-base bg-amber-50/30 focus:bg-white focus:ring-4 focus:ring-amber-200 outline-none transition" 
                                rows="2" placeholder="點此填寫醫生的說明與紀錄...">${q.answer || ''}</textarea>
                        </div>
                    `;
                }

                let notesListHtml = '';
                if (q.notes && q.notes.length > 0) {
                    notesListHtml = q.notes.map((note, nIndex) => `
                        <div class="bg-amber-50/70 border-l-4 border-amber-500 rounded-r-xl p-3 mb-2 flex justify-between items-start gap-2">
                            <div class="text-elderly-base text-amber-950 flex-1">
                                <span class="font-bold text-amber-800 mr-2">[家人/診後補充]:</span>${note}
                            </div>
                            <button onclick="deleteNote('${q.id}', ${nIndex})" class="text-gray-400 hover:text-rose-600 p-1">
                                <i class="fa-solid fa-xmark"></i>
                            </button>
                        </div>
                    `).join('');
                }

                const notesContainerHtml = `
                    <div class="mt-6 pt-4 border-t border-amber-100">
                        <div class="flex items-center justify-between mb-3">
                            <h3 class="text-elderly-base font-bold text-amber-900 flex items-center gap-2">
                                <i class="fa-solid fa-comments text-amber-600"></i> 家人補充註記與詳細修訂
                            </h3>
                            <button onclick="addNotePrompt('${q.id}')" class="text-amber-700 hover:text-amber-900 font-bold text-elderly-base flex items-center gap-1 bg-amber-100 px-3 py-1.5 rounded-lg border border-amber-300">
                                <i class="fa-solid fa-plus"></i> 新增註記
                            </button>
                        </div>
                        <div>
                            ${notesListHtml || '<p class="text-gray-400 text-elderly-base italic mb-2">尚無補充註記，可點選上方按鈕新增。</p>'}
                        </div>
                    </div>
                `;

                card.innerHTML = headerHtml + answerHtml + notesContainerHtml;
                container.appendChild(card);
            });
        };

        // 事件與彈窗控制邏輯...
        window.setYesNoAnswer = (id, val) => { const q = window.questions.find(i => i.id === id); if(q){ q.answer = val; window.saveData(); }};
        window.updateTextAnswer = (id, text) => { const q = window.questions.find(i => i.id === id); if(q){ q.answer = text; window.saveData(); }};
        window.addNotePrompt = (id) => { openPromptModal("新增補充註記", "例如：長兄於 10/28 補充說明...", (text) => { if(text && text.trim()){ const q = window.questions.find(i => i.id === id); if(q){ if(!q.notes) q.notes = []; q.notes.push(text.trim()); window.saveData(); }}});};
        window.deleteNote = (id, idx) => { const q = window.questions.find(i => i.id === id); if(q && q.notes){ q.notes.splice(idx, 1); window.saveData(); }};
        window.toggleEditMode = () => { window.isEditMode = !window.isEditMode; document.getElementById('editBanner').classList.toggle('hidden', !window.isEditMode); document.getElementById('addQuestionBox').classList.toggle('hidden', !window.isEditMode); document.getElementById('editModeBtnText').innerText = window.isEditMode ? '關閉編輯模式' : '開啟「編輯/新增題目」模式'; renderQuestionnaire(); };
        window.editQuestionTitle = (id) => { const q = window.questions.find(i => i.id === id); if(!q) return; openPromptModal("修改問題內容", "", (text) => { if(text && text.trim()){ q.title = text.trim(); window.saveData(); }}, q.title); };
        window.deleteQuestion = (id) => { window.questions = window.questions.filter(q => q.id !== id); window.saveData(); };
        window.addNewQuestionPrompt = () => { openPromptModal("新增問卷題目", "例如：4-1. 療程期間飲食有什麼限制？", (text) => { if(text && text.trim()){ window.questions.push({ id: 'q_' + Date.now(), type: 'text', title: text.trim(), answer: '', notes: [] }); window.saveData(); }}); };
        window.resetToDefaultPrompt = () => { openPromptModal("恢復預設問題", "請輸入「重置」以確認。", (text) => { if(text === '重置'){ window.questions = JSON.parse(JSON.stringify(defaultQuestions)); window.saveData(); showModal("提示", "已成功恢復預設問卷。"); }}); };

        window.showModal = (title, msg) => { document.getElementById('modalTitle').innerText = title; document.getElementById('modalMessage').innerText = msg; document.getElementById('messageModal').classList.remove('hidden'); };
        window.closeModal = () => { document.getElementById('messageModal').classList.add('hidden'); };
        window.openPromptModal = (title, placeholder, callback, defaultValue = '') => { document.getElementById('promptTitle').innerText = title; const input = document.getElementById('promptInput'); input.placeholder = placeholder; input.value = defaultValue; window.promptCallback = callback; document.getElementById('promptModal').classList.remove('hidden'); input.focus(); };
        window.closePromptModal = () => { document.getElementById('promptModal').classList.add('hidden'); window.promptCallback = null; };
        document.getElementById('promptConfirmBtn').addEventListener('click', () => { if (window.promptCallback) window.promptCallback(document.getElementById('promptInput').value); closePromptModal(); });

        initApp();
    </script>
</body>
</html>
